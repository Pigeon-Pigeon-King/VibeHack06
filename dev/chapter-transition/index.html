<!doctype html>
<html lang="zh-CN">
  <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>重返木卫三 · 章节过场预览</title></head>
  <body>
    <main id="preview-controls">
      <p class="eyebrow">重返木卫三 · 独立功能预览</p>
      <h1>章节之间</h1>
      <p class="intro">选择一段故事，体验字幕衔接。左键跳过旁白，加载结束后自动进入。</p>
      <form id="preview-form">
        <label>故事段落<select id="bridge"></select></label>
        <label>加载情形<select id="loading"><option value="quick">快速加载 · 2 秒</option><option value="slow">慢速加载 · 35 秒</option><option value="retry">首次失败，重试恢复</option></select></label>
        <button type="submit">播放过场</button>
      </form>
      <p class="note">此页使用模拟关卡加载。旁白录音交付前，字幕按阅读时长推进；主战役接线另行合入。</p>
      <output id="result" aria-live="polite">准备播放</output>
      <details><summary>查看本段全文</summary><div id="transcript"></div></details>
    </main>
    <script type="module" src="./preview.ts"></script>
  </body>
</html>
