<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>F-35B 原工厂独立渲染检视</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#1e2a35;color:#edf4f7;font:16px system-ui,sans-serif}canvas{display:block;width:100vw;height:100vh}#panel{position:fixed;top:14px;left:14px;max-width:620px;background:#10202de8;border:1px solid #6b8294;padding:12px;z-index:2}h1{font-size:18px;margin:0 0 8px}.row{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}button{font:inherit;color:#eff6fa;background:#304c61;border:1px solid #89a8bd;border-radius:4px;padding:6px 10px}button[aria-pressed=true]{background:#486e57}input{vertical-align:middle}#clock{width:210px}#stats,#errors{font:13px ui-monospace,monospace;white-space:pre-wrap;margin:8px 0 0}#errors{color:#ffaf9c}#caption{position:fixed;bottom:14px;left:14px;background:#10202dd9;padding:8px 12px;max-width:850px}a{color:#afd4ff}
  </style>
</head>
<body>
  <section id="panel">
    <h1>F-35B 原工厂独立渲染检视</h1>
    <div class="row">
      <button id="near" aria-pressed="true">近距无雾</button>
      <button id="near-gray" aria-pressed="false">近距灰天</button>
      <button id="s12" aria-pressed="false">S12 近点 .004 雾</button>
      <button id="s12-clear" aria-pressed="false">S12 同点无雾</button>
    </div>
    <div class="row">
      <button id="original" aria-pressed="true">原材质</button>
      <button id="normal" aria-pressed="false">法线诊断</button>
      <button id="basic" aria-pressed="false">白色无光照诊断</button>
      <button id="gear" aria-pressed="false">悬停放轮</button>
    </div>
    <div class="row"><label>路径时间 <input id="clock" type="range" min="0" max="52" step="0.1" value="6" /> <output id="time">6.0 s</output></label><label><input id="play" type="checkbox" /> 播放</label></div>
    <pre id="stats">正在从本地源码加载原工厂…</pre><pre id="errors">错误：0</pre>
  </section>
  <div id="caption">仅验证原工厂渲染，不替代 S12 实景验收。模型来自本项目 <code>src/presentation/reused-aircraft.ts</code>；没有替换、下载或重画机体。</div>
  <script type="module" src="./review.js"></script>
</body>
</html>
