<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>移动横屏独立验收</title><style>
body{margin:16px;background:#25313a;color:#eef1ec;font:16px/1.5 system-ui}header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}button{font:inherit;padding:8px 12px;min-height:44px;cursor:pointer}iframe{display:block;border:1px solid #899ba5;background:#101d25}pre{font:14px/1.45 ui-monospace,monospace;white-space:pre-wrap;max-width:1050px}h1{font-size:20px;margin:0 16px 0 0}
</style></head><body>
<header><h1>移动横屏 · 独立候选</h1><button data-size="844,390">844 × 390</button><button data-size="667,375">667 × 375</button><button data-size="390,844">竖屏 390 × 844</button><button data-size="1024,768">1024 × 768</button><button id="safe">刘海安全区模拟：关</button><button id="snapshot">保存检查记录</button></header>
<iframe title="重返木卫三独立候选" id="game" width="844" height="390"></iframe><pre id="status">等待实际页面载入。这是桌面视口检查，不是真实手机。</pre>
<script type="module">
const frame=document.querySelector('#game'),status=document.querySelector('#status');
const requested=new URLSearchParams(location.search).get('game');
frame.src=requested==='dist/'?'./dist/':'/';
let safe=false,record=null;
for(const button of document.querySelectorAll('[data-size]'))button.onclick=()=>{const[w,h]=button.dataset.size.split(',');frame.width=w;frame.height=h;};
document.querySelector('#safe').onclick=()=>{safe=!safe;document.querySelector('#safe').textContent=`刘海安全区模拟：${safe?'开':'关'}`;const app=frame.contentDocument?.querySelector('#app');if(app){for(const[name,value]of Object.entries({'--touch-left':'calc(var(--touch-edge) + 44px)','--touch-right':'calc(var(--touch-edge) + 44px)','--touch-bottom':'45px'})){if(safe)app.style.setProperty(name,value);else app.style.removeProperty(name);}}};
function read(){try{const d=frame.contentDocument,app=d.querySelector('#app');if(!app)return;const bounds=s=>{const e=d.querySelector(s);if(!e||e.hidden||!e.getClientRects().length)return null;const r=e.getBoundingClientRect();return {x:Math.round(r.x*10)/10,y:Math.round(r.y*10)/10,width:Math.round(r.width*10)/10,height:Math.round(r.height*10)/10};};record={at:new Date().toISOString(),environment:'Safari desktop iframe / no physical phone',url:frame.contentWindow.location.href,ua:frame.contentWindow.navigator.userAgent,viewport:[frame.contentWindow.innerWidth,frame.contentWindow.innerHeight],dpr:frame.contentWindow.devicePixelRatio,mode:d.querySelector('.game-interface')?.dataset.mode,touch:app.classList.contains('touch-input'),portrait:app.classList.contains('touch-portrait'),simulatedSafeInsets:safe,held:[...d.querySelectorAll('.is-held')].map(e=>e.dataset.touchControl||e.className),stick:d.querySelector('.touch-joystick')?.getAttribute('style'),ammo:d.querySelector('[data-ui="ammo"]')?.textContent,objective:d.querySelector('[data-ui="objective"]')?.textContent,layout:Object.fromEntries(['.touch-move-zone','.touch-joystick','.touch-look-zone','.touch-action-grid','.touch-context-actions','.radio-subtitle','.objective-cluster','.survival-cluster','.ammunition-cluster','.touch-pause','.touch-rotation-notice'].map(s=>[s,bounds(s)]))};status.textContent=JSON.stringify(record,null,2);}catch(error){status.textContent=String(error);}}
setInterval(read,800);document.querySelector('#snapshot').onclick=()=>{read();const a=document.createElement('a');a.download=`mobile-layout-${frame.width}x${frame.height}-${Date.now()}.json`;a.href=URL.createObjectURL(new Blob([JSON.stringify(record,null,2)],{type:'application/json'}));a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};
</script></body></html>
